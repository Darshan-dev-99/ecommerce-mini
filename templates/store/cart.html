{% extends 'store/base.html' %}
{% load static %}
{% block title %}My cart — BazaarNoon{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1>My cart</h1>
    <p id="cart-sub">Prices are inclusive of GST. Delivery fee is waived above ₹499.</p>
  </div>
  <a class="link" href="/shop/">Continue shopping →</a>
</div>

<div class="cart-layout">
  <div class="stack">
    <section class="card" id="cart-items" aria-live="polite">
      <div class="pad"><div class="skeleton sk-line" style="width:40%"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line" style="width:70%"></div></div>
    </section>
    <section class="card" id="saved-section" hidden>
      <div class="pad-sm" style="border-bottom:1px solid var(--line-soft)"><b>Saved for later</b></div>
      <div id="saved-items"></div>
    </section>
    <section class="card pad" id="cart-offers">
      <b class="small">Available offers</b>
      <div class="stack" id="offer-list" style="margin-top:10px;gap:10px"></div>
    </section>
  </div>
  <aside class="card summary" id="summary">
    <div class="pad"><div class="skeleton sk-line" style="width:60%"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line" style="width:45%"></div></div>
  </aside>
</div>
{% endblock %}

{% block scripts %}<script type="module" src="{% static 'js/cart.js' %}"></script>{% endblock %}
